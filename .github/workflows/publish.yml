name: Build & Publish @chief-strategist-j/shared-infra

on:
  push:
    branches:
      - main

jobs:
  publish:
    name: Build & Publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@chief-strategist-j"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Auto-Bump Patch Version if Already Published
        run: |
          EXISTING_VERSION=$(npm view @chief-strategist-j/shared-infra version 2>/dev/null || echo "")
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if [ -n "$EXISTING_VERSION" ] && [ "$EXISTING_VERSION" = "$CURRENT_VERSION" ]; then
            echo "Version $CURRENT_VERSION already published on registry. Auto-bumping patch version..."
            npm version patch --no-git-tag-version
          fi

      - name: Publish to GitHub Packages
        run: npm publish
