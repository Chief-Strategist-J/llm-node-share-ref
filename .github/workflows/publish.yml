name: Build & Publish @chief-strategist-j/shared-infra

on:
  push:
    branches:
      - main

jobs:
  publish:
    name: Build & Publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@chief-strategist-j"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Auto-Bump Patch Version & Commit to Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          EXISTING_VERSION=$(npm view @chief-strategist-j/shared-infra version 2>/dev/null || echo "")
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          
          if [ "$EXISTING_VERSION" = "$CURRENT_VERSION" ]; then
            echo "Version $CURRENT_VERSION is already published. Auto-bumping patch version..."
            npm version patch -m "chore(release): v%s [skip ci]"
            git push origin main --follow-tags
          else
            echo "Version $CURRENT_VERSION is ready to publish."
          fi

      - name: Publish to GitHub Packages
        run: npm publish

